<div class="list scroll-x" *ngIf="incidents.length; else noIncidents">
  <button
    class="incident-card card-in"
    *ngFor="let inc of incidents; trackBy: trackByIncidentId"
    [class.active]="inc.incident_id === selectedId"
    [attr.aria-pressed]="inc.incident_id === selectedId"
    (click)="pick(inc.incident_id)"
  >
    <div class="row-top">
      <span class="chip severity-chip" [ngClass]="inc.severity">{{ inc.severity }}</span>
      <span class="status mono">{{ inc.status }}</span>
    </div>
    <div class="headline">{{ inc.headline }}</div>
    <div class="meta mono">
      <mat-icon inline="true">place</mat-icon>{{ inc.entity_id }}
    </div>
    <div class="meta mono">
      <mat-icon inline="true">schedule</mat-icon>opened {{ inc.opened_on }}
    </div>
  </button>
</div>

<ng-template #noIncidents>
  <div class="empty">
    <mat-icon>radar</mat-icon>
    <div class="empty-title">No incidents yet on this date</div>
    <div class="empty-body">
      Press <strong>Play</strong> (or space) to run July, or jump straight to
      <button class="inline-link" (click)="jumpTo('2026-07-21')">21 Jul</button> for the
      Cedar Ridge site event.
    </div>
  </div>
</ng-template>
