<div class="shell" *ngIf="state$ | async as state">
  <header class="topbar">
    <div class="brand-group">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 class="brand">MoveOps</h1>
      <span class="brand-sub">fleet reasoning agent</span>
    </div>

    <div class="topbar-right">
      <span class="status-pill" [class.live]="state.status === 'playing'">
        <span class="status-dot" aria-hidden="true"></span>
        {{ state.status === 'playing' ? 'Replaying' : 'Paused' }}
      </span>
      <span class="window mono">1–31 July 2026</span>
      <span
        class="shortcut-hint mono"
        matTooltip="Space plays or pauses · arrow keys step one day"
      >
        <mat-icon inline="true">keyboard</mat-icon> space / ← →
      </span>
    </div>
  </header>

  <aside class="rail-left card">
    <app-replay-clock></app-replay-clock>
  </aside>

  <main class="center card">
    <mat-tab-group animationDuration="150ms">
      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">Incidents</span>
          <span class="tab-badge">{{ state.incidents_open }}</span>
        </ng-template>
        <div class="tab-body">
          <app-incident-list
            [selectedId]="selectedIncidentId"
            (select)="selectIncident($event)"
          ></app-incident-list>
          <div class="detail-scroll scroll-y">
            <app-incident-detail [incidentId]="selectedIncidentId"></app-incident-detail>
          </div>
        </div>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">Suppression ledger</span>
          <span class="tab-badge suppressed">{{ state.suppressed }}</span>
        </ng-template>
        <div class="tab-body">
          <app-suppression-ledger></app-suppression-ledger>
        </div>
      </mat-tab>
    </mat-tab-group>
  </main>

  <aside class="rail-right card">
    <app-memory-panel></app-memory-panel>
  </aside>

  <footer class="footer card">
    <app-report-card></app-report-card>
  </footer>
</div>
